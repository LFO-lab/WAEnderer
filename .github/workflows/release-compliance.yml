name: Release compliance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the locked release environment
        run: uv sync --locked --all-extras
      - name: Check licensing and attribution
        run: uv run python bin/check_release_compliance.py
      - name: Run release compliance tests
        run: uv run python -m pytest tests/test_release_compliance.py tests/test_export_web_decoder.py
      - name: Build source and wheel distributions
        run: uv build
      - name: Generate environment evidence
        run: uv run python bin/generate_release_evidence.py
      - name: Enforce dependency license policy
        run: uv run python bin/check_release_compliance.py --license-report build/release-evidence/licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: build/release-evidence/
