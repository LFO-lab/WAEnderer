<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stable Audio Wanderer - Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        #container {
            display: flex;
            height: 100vh;
        }
        
        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d0d14;
        }
        
        #controls {
            width: 340px;
            background: #12121a;
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid #2a2a3a;
        }
        
        h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
        }
        
        h2 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin: 20px 0 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #2a2a3a;
        }
        
        h3 {
            font-size: 11px;
            font-weight: 500;
            color: #666;
            margin: 12px 0 8px;
        }
        
        .control-group {
            margin-bottom: 12px;
        }
        
        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
        }
        
        .control-value {
            color: #4a9eff;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
        }
        
        input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #2a2a3a;
            border-radius: 2px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #4a9eff;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            background: #6ab0ff;
        }
        
        select {
            width: 100%;
            padding: 6px 8px;
            font-size: 12px;
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 4px;
            color: #e0e0e0;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: #4a9eff;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            margin-bottom: 15px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4a4a;
        }
        
        .status-dot.connected {
            background: #4aff6a;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .info-item {
            background: #1a1a24;
            padding: 8px;
            border-radius: 6px;
        }
        
        .info-label {
            font-size: 9px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 2px;
        }
        
        .info-value {
            font-size: 14px;
            font-family: 'SF Mono', Monaco, monospace;
            color: #fff;
        }
        
        .viz-options {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .viz-option {
            padding: 5px 10px;
            font-size: 11px;
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 4px;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .viz-option:hover {
            background: #222230;
            color: #ccc;
        }
        
        .viz-option.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #fff;
        }
        
        button {
            width: 100%;
            padding: 8px;
            font-size: 12px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        
        button:hover {
            background: #6ab0ff;
        }
        
        button.secondary {
            background: #2a2a3a;
        }
        
        button.secondary:hover {
            background: #3a3a4a;
        }

        button.danger {
            background: #b43f3f;
        }

        button.danger:hover {
            background: #cf5050;
        }
        
        .control-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .control-row .control-group {
            margin-bottom: 8px;
        }

        /* Toggle switch styles */
        .toggle {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2a2a3a;
            transition: 0.3s;
            border-radius: 20px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: #666;
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle input:checked + .toggle-slider {
            background-color: #4a9eff;
        }

        .toggle input:checked + .toggle-slider:before {
            transform: translateX(20px);
            background-color: #fff;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        <div id="controls">
            <h1>Stable Audio Wanderer</h1>
            
            <div class="status">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Disconnected</span>
            </div>
            
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Index</div>
                    <div class="info-value" id="info-index">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Velocity</div>
                    <div class="info-value" id="info-velocity">0.00</div>
                </div>
                <div class="info-item">
                    <div class="info-label">File ID</div>
                    <div class="info-value" id="info-file">0</div>
                </div>
            </div>
            
            <h2>Visualization</h2>
            <div class="viz-options">
                <div class="viz-option active" data-mode="scatter">Scatter</div>
                <div class="viz-option" data-mode="trail">Trail Only</div>
                <div class="viz-option" data-mode="heatmap">Heatmap</div>
            </div>
            
            <h2>Policy Controls</h2>
            
            <div class="control-row">
                <div class="control-group">
                    <div class="control-label">
                        <span>Width</span>
                        <span class="control-value" id="val-width">0.50</span>
                    </div>
                    <input type="range" id="ctrl-width" min="0" max="1" step="0.01" value="0.5">
                </div>
                
                <div class="control-group">
                    <div class="control-label">
                        <span>Energy</span>
                        <span class="control-value" id="val-energy">0.50</span>
                    </div>
                    <input type="range" id="ctrl-energy" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>
            
            <div class="control-row">
                <div class="control-group">
                    <div class="control-label">
                        <span>Gravity</span>
                        <span class="control-value" id="val-gravity">0.50</span>
                    </div>
                    <input type="range" id="ctrl-gravity" min="0" max="1" step="0.01" value="0.5">
                </div>
                
                <div class="control-group">
                    <div class="control-label">
                        <span>Memory</span>
                        <span class="control-value" id="val-memory">0.00</span>
                    </div>
                    <input type="range" id="ctrl-memory" min="0" max="1" step="0.01" value="0">
                </div>
            </div>
            
            <div class="control-row">
                <div class="control-group">
                    <div class="control-label">
                        <span>Coherence</span>
                        <span class="control-value" id="val-coherence">0.00</span>
                    </div>
                    <input type="range" id="ctrl-coherence" min="0" max="1" step="0.01" value="0">
                </div>
                
                <div class="control-group">
                    <div class="control-label">
                        <span>Exploration</span>
                        <span class="control-value" id="val-exploration">0.00</span>
                    </div>
                    <input type="range" id="ctrl-exploration" min="0" max="1" step="0.01" value="0">
                </div>
            </div>

            <h2>Decoder</h2>

            <div class="control-row">
                <div class="control-group">
                    <div class="control-label">
                        <span>Gain</span>
                        <span class="control-value" id="val-gain">1.00</span>
                    </div>
                    <input type="range" id="decoder-gain" min="0" max="2" step="0.01" value="1">
                </div>

                <div class="control-group">
                    <div class="control-label">
                        <span>Smoothing</span>
                        <span class="control-value" id="val-smoothing">0.10</span>
                    </div>
                    <input type="range" id="decoder-smoothing" min="0" max="1" step="0.01" value="0.1">
                </div>
            </div>

            <button id="btn-reset">Reset Policy</button>
            <button id="btn-reconnect" class="secondary">Reconnect</button>
            <button id="btn-exit" class="danger">Exit Performer</button>
        </div>
    </div>
    
    <script src="sketch.js"></script>
</body>
</html>
