    - implement real use of decoder smoothing or remove/deprecate the control surface
    - change random training to save best-validation weights, not just final weights
    - either supervise/remove the LatentPolicy log-std head
    - update or remove simple_test.py
    - align setup.py with requirements.txt or explicitly document that setup.py is non-canonical
  architectural_decisions_to_revisit:
    - decide whether manifold decoding should consume the unconstrained policy trajectory rather than observed corpus frames
    - decide whether manual artifact loading should remain mandatory for all runtime modes
    - decide whether docs/variable-inference-windows.md should be updated from proposal to implemented/partial
  safe_edit_zones_for_most_future_work:
    - stable_audio_wanderer/runtime/
    - stable_audio_wanderer/policy/
    - bin/
    - web/
