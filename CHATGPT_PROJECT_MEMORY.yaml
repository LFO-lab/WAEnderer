validation:
  targeted_tests_run_during_memory_generation:
    passed:
      - .venv/bin/python test_policy_timbre_swap.py
      - .venv/bin/python test_policy_recompose.py
      - .venv/bin/python test_policy_v2_runtime.py
      - .venv/bin/python test_policy_v2_units.py
      - .venv/bin/python test_timbral_wandering.py
    failed:
      - .venv/bin/python simple_test.py
  interpretation:
    passing_surface:
      - timbre-aware seed swapping
      - random-mode recomposition logic
      - V2 runtime fallback behavior
      - V2 unit artifact construction
      - manual wandering behavior
    failing_surface:
      - simple_test.py appears stale rather than signaling a proven runtime regression
  simple_test_failure_reason: >-
    simple_test.py uses brittle string checks against perform.py and expects literal substrings such
    as wander_k=1 and wander_speed=0.0 that no longer match the current file text. It also includes
    hard-coded absolute repo paths, which makes it maintenance-heavy.

known_issues_and_gotchas:
  - perform.py requires the manual artifact up front, so random-only and reorganized-only runs still depend on manual_navigation.npz existing.
  - The decoder smoothing control is exposed everywhere but currently does not change actual crossfade behavior.
  - Random policy training saves the final checkpoint rather than the best-validation checkpoint.
  - The LatentPolicy variance head is effectively unsupervised because delta_log_std is not used in the training loss.
  - setup.py does not declare the real runtime dependencies.
  - stable_audio_wanderer/cli is not an active source package despite the directory existing.
  - build/lib contains stale packaged copies and should not be edited as source.
  - The live runtime remains retrieval-led; it does not yet decode unconstrained policy latents directly.
  - The checked-in UI depends on CDN-hosted p5.js.
  - simple_test.py is stale and currently failing.

