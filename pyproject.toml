[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-audio-wanderer"
version = "0.1.0"
description = "Real-time latent-space navigation for personal audio corpora"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "licenses/*.md",
  "licenses/*.txt",
]
authors = [
  { name = "Dominic Thibault" },
  { name = "David Piazza" },
]
dependencies = [
  "torch>=2.3",
  "torchaudio>=2.3",
  "soundfile>=0.12",
  "numpy>=1.25",
  "sounddevice>=0.4.6",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "faiss-cpu>=1.7.4",
  "python-osc>=1.8",
  "websockets>=12.0",
  "tqdm>=4.66",
  "umap-learn>=0.5.6",
  "diffusers==0.35.1",
  "transformers>=4.43",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "onnxruntime>=1.26",
]

[project.optional-dependencies]
export = ["onnx>=1.21", "onnxscript>=0.7"]
same-s-helpers = ["einops-exts", "huggingface-hub>=1.7.1"]
dev = ["build>=1.2", "pytest>=8"]
release = ["build>=1.2", "cyclonedx-bom", "pip-licenses"]

[project.urls]
Homepage = "https://lfo-lab.github.io/Stable-Audio-Wanderer/"
Repository = "https://github.com/LFO-lab/Stable-Audio-Wanderer"

[tool.setuptools.packages.find]
include = ["stable_audio_wanderer*"]

[tool.setuptools.package-data]
"stable_audio_wanderer.resources.same_s" = ["*.onnx", "*.json", "*.md", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
