[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-audio-wanderer"
version = "0.1.0"
description = "Real-time latent-space navigation for personal audio corpora"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES.md",
  "licenses/*.md",
  "licenses/*.txt",
]
authors = [
  { name = "Dominic Thibault" },
  { name = "David Piazza" },
]
dependencies = [
  "torch>=2.3",
  "torchaudio>=2.3",
  "soundfile>=0.12",
  "numpy>=1.25",
  "sounddevice>=0.4.6",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "faiss-cpu>=1.7.4",
  "python-osc>=1.8",
  "websockets>=12.0",
  "tqdm>=4.66",
  "umap-learn>=0.5.6",
  "onnxruntime>=1.26",
  "onnx>=1.21",  # Runtime artifact/external-weight validation; export also uses onnxscript.
]

[project.optional-dependencies]
native-stable-audio-open = [
  "diffusers==0.35.1", "transformers>=4.43", "accelerate>=0.33", "safetensors>=0.4",
]
native-same-s = [
  "torch==2.7.1", "torchaudio==2.7.1",
  "stable-audio-3 @ git+https://github.com/Stability-AI/stable-audio-3.git@779434a908193105335fd8d833418603625b2859",
]
export = ["onnxscript>=0.7"]
same-s-helpers = ["einops-exts", "huggingface-hub>=1.7.1"]
dev = ["build>=1.2", "pytest>=8"]
release = ["build>=1.2", "cyclonedx-bom", "pip-licenses"]

[project.urls]
Homepage = "https://lfo-lab.github.io/WAEnderer/"
Repository = "https://github.com/LFO-lab/WAEnderer"

[project.scripts]
waenderer-serve = "stable_audio_wanderer.cli.serve:main"
waenderer-prepare = "stable_audio_wanderer.cli.prepare_decoders:main"
waenderer-model-bundle = "stable_audio_wanderer.model_distribution:main"
waenderer-check-delivery = "stable_audio_wanderer.delivery_checks:main"

[tool.setuptools.packages.find]
include = ["stable_audio_wanderer*"]

[tool.setuptools.package-data]
"stable_audio_wanderer.resources" = ["**/*.onnx", "**/*.data", "**/*.json", "**/*.md", "**/*.txt"]
"stable_audio_wanderer.resources.same_s" = ["*.onnx", "*.data", "*.json", "*.md", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
